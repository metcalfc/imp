name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A quoting break otherwise reads as a style complaint rather than
      # "does not parse".
      - name: bash -n
        run: bash -n imp-auth

      # Pinned, with a checksum. The runner image's shellcheck drifts, and a
      # version that disagrees with the one on the author's machine turns CI
      # red for findings that are clean locally.
      - name: shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfL -o shellcheck.tar.xz "$url"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          "shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version
          "shellcheck-${SHELLCHECK_VERSION}/shellcheck" imp-auth

      - name: py_compile
        run: python3 -m py_compile imp

      - name: ruff
        run: |
          pip install --disable-pip-version-check --quiet ruff
          ruff check --select E9,F63,F7,F82 imp tests/

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No third-party packages on either end -- that is a feature, so the
      # test run installs nothing either.
      - name: unittest
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -v

      # The lint job runs bash 5. macOS still ships /bin/bash 3.2.57, which is
      # what imp-auth actually has to parse there -- and it is the only place
      # CI can see that. Explicitly /bin/bash: Homebrew's bash 5 is on PATH on
      # these runners and would hide the breakage.
      - name: /bin/bash 3.2 parses imp-auth
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -1
          /bin/bash -n imp-auth
